<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Lineup Cup</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .fixture {
      text-align: center;
      margin: 40px 0;
    }

    .status {
      padding: 15px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>THE LINEUP CUP</h1>

  <div class="fixture">
    <h2 id="opponent">Loading fixture...</h2>
    <p id="season"></p>
  </div>

  <div class="status">
    <strong>NUNGUS</strong><br>
    Not submitted
  </div>

  <div class="status">
    <strong>DUNGUS</strong><br>
    Not submitted
  </div>

  <button onclick="window.location.href='prediction.html'">
    MAKE MY PREDICTION
  </button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
  const SUPABASE_URL = "https://ootxpnwkkhtrxouzbfmf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_0vLcoFsUvwa1ZJKVWPw5BQ_8VOTKuMe";

  async function loadFixture() {
    try {
      const response = await fetch(
  SUPABASE_URL +
  "/rest/v1/fixtures?select=*&order=fixture_date.asc&limit=1&apikey=" +
  encodeURIComponent(SUPABASE_KEY)
);

      if (!response.ok) {
  const errorText = await response.text();
  throw new Error("Database error " + response.status + ": " + errorText);
}
      
      const data = await response.json();

      if (!data.length) {
        throw new Error("No fixture found");
      }

      const fixture = data[0];

      document.getElementById("opponent").textContent =
        "Exeter Chiefs v " + fixture.opponent;

      document.getElementById("season").textContent =
        fixture.competition + " · " + fixture.season;

    } catch (error) {
      console.error(error);

      document.getElementById("opponent").textContent =
  error.message;
    }
  }

  loadFixture();
</script>
  
</body>
</html>
