<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Lineup Cup</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .fixture {
      text-align: center;
      margin: 40px 0;
    }

    .status {
      padding: 15px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>THE LINEUP CUP</h1>

  <div class="fixture">
    <h2>Exeter Chiefs v Gloucester</h2>
    <p>2026/27</p>
  </div>

  <div class="status">
    <strong>NUNGUS</strong><br>
    Not submitted
  </div>

  <div class="status">
    <strong>DUNGUS</strong><br>
    Not submitted
  </div>

  <button onclick="window.location.href='prediction.html'">
    MAKE MY PREDICTION
  </button>

</body>
</html>
