const lineup = document.getElementById("lineup");

positions.forEach((position, index) => {

  const number = index + 1;

  const container = document.createElement("div");
  container.className = "position";

  const label = document.createElement("label");
  label.textContent = number + ". " + position;

  const select = document.createElement("select");
  select.id = "player" + number;

  const blank = document.createElement("option");
  blank.value = "";
  blank.textContent = "Select player";
  select.appendChild(blank);

  players.forEach(player => {
    const option = document.createElement("option");
    option.value = player;
    option.textContent = player;
    select.appendChild(option);
  });

  container.appendChild(label);
  container.appendChild(select);

  lineup.appendChild(container);

});


async function lockPrediction() {

  const picks = [];

  for (let i = 1; i <= 23; i++) {
    picks.push(
      document.getElementById("player" + i).value
    );
  }

  // Check every position is filled
  if (picks.includes("")) {
    alert("You need to select all 23 players.");
    return;
  }

  // Check for duplicate players
  if (new Set(picks).size !== 23) {
    alert("You've selected the same player more than once.");
    return;
  }

  // Find logged-in user
  const {
    data: { session }
  } = await db.auth.getSession();

  if (!session) {
    window.location.href = "login.html";
    return;
  }

  // Find whether this is NUNGUS or DUNGUS
  const { data: profile, error: profileError } =
    await db
      .from("profiles")
      .select("nickname")
      .eq("id", session.user.id)
      .single();

  if (profileError) {
    alert("Could not identify player.");
    return;
  }

  // Get current fixture
  const { data: fixture, error: fixtureError } =
    await db
      .from("fixtures")
      .select("id")
      .order("fixture_date", { ascending: true })
      .limit(1)
      .single();

  if (fixtureError) {
    alert("Could not find the current fixture.");
    return;
  }

  // Check whether you've already submitted
  const { data: existing } =
    await db
      .from("predictions")
      .select("id")
      .eq("fixture_id", fixture.id)
      .eq("user_id", session.user.id)
      .maybeSingle();

  if (existing) {
    alert("Your prediction is already locked in.");
    return;
  }

  // Save prediction
  const { error } =
    await db
      .from("predictions")
      .insert({
        fixture_id: fixture.id,
        user_id: session.user.id,
        player: profile.nickname,
        lineup: picks
      });

  if (error) {
    console.error(error);
    alert("Something went wrong saving your prediction.");
    return;
  }

  alert("Your 23 is locked in!");

  window.location.href = "index.html";
}
